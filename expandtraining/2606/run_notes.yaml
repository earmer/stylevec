# One concise note per run: what it tests, its result, its status. It becomes the SwanLab description
# (set at init; push edits with scripts/swanlab_notes.py). Preflight refuses a spec whose runs have no note.
# Add the note before launching; update it when the run ends, is stopped or is superseded.

curriculum_a_1gpu__uniform__s42: >
  Round A (old 64-line base), exposure baseline: every rule equally likely. Held-out top-1 lift +0.052; gaps
  topic_matched 0.178, origin_vs_para 0.165. Done; trained head lost to --prune.
curriculum_a_1gpu__mixed__s42: >
  Round A: staged's time-averaged tier mix, no order. Lift +0.067; origin_vs_para gap fell to 0.053. Done; head pruned.
curriculum_a_1gpu__staged__s42: >
  Round A: easy-to-hard staged curriculum. Best lift +0.086 but weakest same-speaker gaps (0.126 / 0.135), which
  moved the base to 256 lines per speaker and a 150k cap. Done; head pruned.

curriculum_a2_1gpu__uniform__s42: &a2_uniform >
  Round A2 (256-line base, 2 seeds): uniform rule mix. Lift +0.059; origin_vs_para gap 0.087, the best of the
  three; topic_matched 0.148. Done.
curriculum_a2_1gpu__uniform__s43: *a2_uniform
curriculum_a2_1gpu__mixed__s42: &a2_mixed >
  Round A2: mixed. Lift +0.061, within noise of uniform; origin_vs_para gap 0.009 (worse). Done.
curriculum_a2_1gpu__mixed__s43: *a2_mixed
curriculum_a2_1gpu__staged__s42: &a2_staged >
  Round A2: staged. Lift +0.052, worse than mixed on 2 seeds; every arm peaks at step 1050 and then slips. Done.
curriculum_a2_1gpu__staged__s43: *a2_staged

spread_a_1gpu__control__s42: >
  Spread A (audited data d-cfa298ce2f92, staged): no change. Never left a narrow cone (train cos 0.85-0.96);
  top-1 0.095, effective rank 5.6. Done.
spread_a_1gpu__decorr__s42: >
  Spread A: correlation decorrelation, weight 0.02. Escaped the cone until step ~950, then blew up; stopped at
  ~1800, not validated.
spread_a_1gpu__center__s42: >
  Spread A: running-mean centering before the projection. top-1 0.108, gaps topic_matched 0.133 / origin_vs_para
  0.189, effective rank 3.7, length_r2 0.77. Kept as the base. Done.
spread_a_1gpu__center_decorr__s42: >
  Spread A: center + decorr. top-1 0.100, no rank gain, origin_vs_para gap down to 0.071. Decorr dropped. Done.

infonce_a_1gpu__center__s42: >
  InfoNCE A: rerun of spread_a's center as the reference. Stopped on purpose; spread_a_1gpu__center__s42 stands in.
infonce_a_1gpu__center_infonce__s42: >
  InfoNCE A: in-batch InfoNCE (T 0.05, same-style masked). top-1 0.108 -> 0.235 (cross-scene 0.231, paired +0.124,
  better), effective rank 33. But content leaks: origin_vs_para gap -0.262, topic_matched 0.017, provenance 0.741. Done.
infonce_a_1gpu__center_infonce_m64__s42: >
  InfoNCE A: InfoNCE + Matryoshka at [64] only. Same as center_infonce at steps 1050/2100 (macro top-1 0.249 vs
  0.243, same content leak). Stopped at ~step 2100 of 3000; no final validation.

infonce_b_1gpu__center_infonce_hinge__s42: >
  InfoNCE B: InfoNCE + the per-row triplet hinge at weight 10, to bring the content gaps back. Steps 0-405 of this
  experiment are a stopped weight-1 run (hinge ~4% of the loss, tracked center_infonce exactly); the weight-10
  run restarted from step 0 at 23:09 on 2026-10-22 and logs into the same experiment. Macro top-1 / origin_vs_para
  gap: step 1050 0.196 / +0.029, step 2100 0.187 / +0.003, final 0.176 / -0.134 (center_infonce final ~0.235 /
  -0.262). Halves the leak but does not stop it; step 2100 is the best balance. Done.
infonce_b_1gpu__center_infonce_hinge_chead__s42: >
  InfoNCE B: hinge run + an 8-dim content head (InfoNCE on line/paraphrase pairs, same-speaker lines as
  negatives) and a style/content leak penalty at 0.05. Final macro top-1 0.194 (hinge 0.176, within noise over 20
  speakers), whitened 0.353, rank 18.8; origin_vs_para gap -0.178 (hinge -0.134), topic_matched 0.069. Head
  learns content (pair acc ~0.95, pair cos 0.94 vs speaker 0.12) and leak sits near its floor (3.2 vs 2.7), yet
  the style side still drifts to content late. Done.

infonce_c_1gpu__lc_clean__s42: >
  InfoNCE C (short: stops at step 1050; compare with infonce_b hinge's step 1050): hinge recipe with the
  length_course positive built without the anchor's own text. Tests whether overlapping positives teach the
  content shortcut. Step 1050 vs hinge: centered origin_vs_para gap -0.085 -> +0.001, paraphrase beats own
  lines 0.660 -> 0.652 (unchanged), top-1 0.196 -> 0.187 (noise), rank 12.3 -> 10.0. Done.
infonce_c_1gpu__twin__s42: >
  InfoNCE C (stops at 1050): hinge recipe + every row's content twin (paraphrase / rewrite source) as an extra
  InfoNCE candidate at T 0.03. Tests whether full twin coverage holds the origin_vs_para ordering. First
  attempt ran out of GPU memory at step ~30 (SwanLab CRASHED); rerun with gradient checkpointing. Step 1050 vs
  hinge: centered origin_vs_para gap -0.085 -> +0.103, paraphrase beats own lines 0.660 -> 0.489 (chance), but
  top-1 0.196 -> 0.120, whitened 0.284 -> 0.202, rank 12.3 -> 8.8; train InfoNCE loss 2.6 (hinge ~1.1), grad
  norm ~20. Leak gone, retrieval paid for it: T 0.03 too hard. Done.
infonce_c_1gpu__twin_lc_clean__s42: >
  InfoNCE C (stops at 1050): twin + lc_clean together. First attempt ran out of GPU memory (CRASHED); rerun
  with gradient checkpointing. Step 1050: centered origin_vs_para gap +0.189, paraphrase beats own 0.470, but
  top-1 0.127, whitened 0.138, rank 4.1, top component 0.57, grad norm ~41: collapsing. Done.
infonce_c_1gpu__nce_stage1__s42: >
  InfoNCE C (stops at 2100; compare with infonce_b hinge's step 2100): InfoNCE + hinge for stage 1 (steps
  0-1050), then the plain hinge. Tests whether the spread survives while the ordering recovers. Step 2100 vs
  hinge's 2100: centered origin_vs_para gap -0.158 -> -0.021, raw -0.025 -> +0.117, topic_matched cgap 0.071
  -> 0.125, top-1 0.187 -> 0.157, whitened 0.269 -> 0.257, rank 10.6 -> 7.4; paraphrase beats own 0.505. Best
  balance of the four; candidate for the full 3000. Done.

infonce_d_1gpu__nce_stage1__s42: >
  InfoNCE D (full 3000): infonce_c nce_stage1 run to the end. InfoNCE T 0.05 + hinge x10 for stage 1
  (0-1050), then the plain hinge. Tests whether the small origin_vs_para leak (cgap -0.021 at 2100) and the
  top-1 gap to the hinge (0.157 vs 0.187) hold through stage 3. Final vs hinge final: centered
  origin_vs_para gap -0.178 -> -0.040 (raw -0.134 -> +0.050), paraphrase beats own 0.534, topic_matched
  cgap 0.082 -> 0.102, top-1 0.176 -> 0.161, whitened 0.263 -> 0.254, rank 11.1 -> 6.9. The leak crept back
  a little after 2100 (cgap -0.021, para_beats 0.505) but stays far below the hinge's. Done.
infonce_d_1gpu__nce_stage1_twin__s42: >
  InfoNCE D (full 3000): nce_stage1 + each row's content twin as an extra InfoNCE candidate at T 0.1 during
  stage 1 (gradient checkpointing). T 0.03 removed the leak but cost ~40% of top-1; tests whether a softer
  twin keeps the fix without the cost. Final vs nce_stage1: top-1 0.161 -> 0.169, whitened 0.254 -> 0.243,
  centered origin_vs_para gap -0.040 -> -0.047, paraphrase beats own 0.534 -> 0.537, topic_matched cgap
  0.102 -> 0.066, rank 6.9 -> 7.9. No real difference at one seed, for ~1.5x the training time. Done.

leak_hsic_1gpu__hsic_w05__s42: >
  Leak A (full 3000, compare with infonce_d nce_stage1): nce_stage1 + debiased RBF CKA between anchor style
  embeddings and their detached content twins (256-pair queue) at weight 0.5. Tests whether an
  instance-level independence penalty over ~63% of rows removes the origin_vs_para leak. Done 2026-10-24. Step 3000 vs nce_stage1: top-1 0.154 (0.161), whitened
  0.252 (0.254), centered origin_vs_para gap -0.023 (-0.040), paraphrase beats own 0.504 (0.534), rank 6.6
  (6.9). Small leak gain, within likely seed noise; seed-43 control pending.
leak_hsic_1gpu__hsic_w2__s42: >
  Leak A: as hsic_w05 at weight 2. The higher dose; watch whether top-1 pays for it. Done 2026-10-24. Step 3000:
  top-1 0.148 (nce_stage1 0.161), centered gap +0.006 (-0.040), paraphrase beats own 0.505 (0.534), rank 5.6
  (6.9). Gap moves with the dose (-0.040, -0.023, +0.006) for ~0.013 top-1 and a narrower embedding.
leak_adversary_1gpu__adv_w05__s42: >
  Leak B (full 3000, compare with infonce_d nce_stage1): nce_stage1 + an MLP probe that picks each anchor's
  content twin among 512 queued twins from its style embedding; the encoder is pushed to make the pick
  uniform (weight 0.5, ramped over 200 steps). Tests whether an adversarial instance-level content readout
  removes the origin_vs_para leak. Done 2026-10-25. Step 3000 vs nce_stage1: top-1 0.122 (0.161),
  whitened 0.268 (0.254), centered gap +0.054 (-0.040), paraphrase beats own 0.488 (0.534), rank 3.5 (6.9).
  Largest leak fix so far; raw top-1 pays because the embedding collapses to a few directions (whitening
  recovers it).
leak_adversary_1gpu__adv_w2__s42: >
  Leak B: as adv_w05 at weight 2. The higher dose; watch top-1 and leak/probe_acc. Done 2026-10-25. Step
  3000 vs nce_stage1 (top-1 0.161, whitened 0.254, cgap -0.040, para 0.534, topic gap 0.104, rank 6.9):
  top-1 0.142, whitened 0.199, cgap -0.456, para 0.896, topic gap -0.001, rank 33.6. Breaks down: the probe
  wins and the space spreads without style order.
leak_subspace_1gpu__null8__s42: >
  Leak C (full 3000, compare with infonce_d nce_stage1): nce_stage1 with the top 8 principal directions of
  the content twins' embeddings (running EMA covariance) projected out of the style embedding in training
  and inference. Tests whether removing where paraphrases differ removes the leak. Done 2026-10-25. Step
  3000 vs nce_stage1 (top-1 0.161, whitened 0.254, cgap -0.040, para 0.534, topic gap 0.104, rank 6.9):
  top-1 0.116, whitened 0.149, cgap -0.153, para 0.768, topic gap -0.005, rank 51.1. Fails: removing content
  directions removes style too.
leak_subspace_1gpu__null32__s42: >
  Leak C: as null8 with 32 directions. Tests whether a wider cut helps or starts removing voice. Done
  2026-10-25. Step 3000: top-1 0.120, whitened 0.140, cgap -0.328, para 0.865, topic gap 0.033, rank 34.6.
  Worse than null8.
chead_v2_1gpu__chead2__s42: >
  Leak E (full 3000, compare with infonce_d nce_stage1 and infonce_b chead): nce_stage1 + a 64-dim content
  head trained on every row with a content twin (~63% of rows) + the linear leak penalty (0.05). Tests
  whether chead's retrieval (top-1 0.194) survives without its leak once InfoNCE stops at 1050. Done
  2026-10-25. Step 3000 vs nce_stage1 (top-1 0.161, whitened 0.254, cgap -0.040, para 0.534, topic gap
  0.104, rank 6.9): top-1 0.152, whitened 0.369 (best of all), cgap -0.097, para 0.572, topic gap 0.125
  (best), rank 8.9; step 1050 top-1 0.224, whitened 0.410. Best retrieval, still leaks; base of clean_a.
chead_v2_1gpu__chead2_orth__s42: >
  Leak E: chead2 + orthogonal style and content heads (weight 1). Tests whether separating what the heads
  read moves content out of the style side. Done 2026-10-25. Step 3000: top-1 0.142, whitened 0.352, cgap
  -0.144, para 0.596, topic gap 0.083, rank 9.2. Slightly worse than chead2 on every column.
nce_seed_1gpu__nce_stage1__s43: >
  Control (full 3000): infonce_d's nce_stage1 at seed 43. The seed-noise bar for every one-seed leak branch
  (A-E) read against nce_stage1 seed 42. Stopped 2026-10-25 ~10:14 just past step 1050: the AutoDL account
  ran out of balance and the box powered off. No final validation; to be resumed.
curriculum_hard_1gpu__hard30__s42: >
  Leak D (full 3000, compare with infonce_d nce_stage1): stage 3 easy/mid/hard 0.30/0.40/0.30 instead of
  0.20/0.30/0.50. Tests whether the 2100 -> 3000 leak drift comes from the hard topic-matched rows. Done
  2026-10-25. Step 3000 vs nce_stage1 (top-1 0.161, whitened 0.254, cgap -0.040, para 0.534, topic gap
  0.104, rank 6.9): top-1 0.164, whitened 0.254, cgap -0.026, para 0.522, topic gap 0.109, rank 6.8. Small
  gain everywhere, within likely seed noise.
clean_a_1gpu__clean__s42: >
  Clean A (screen to 2100, compare with chead_v2 chead2 at steps 1050 / 2100): chead2 with the curriculum
  grouped by cleanliness instead of difficulty (#5): clean rules only until 0.20, then clean/topic 0.6/0.4,
  then 0.45/0.45 plus 10% confounded (same_speaker_real, length_course). Tests whether a clean start keeps
  content out of the style space. Done 2026-10-25. Step 2100: top-1 0.138, whitened 0.364, cgap -0.013,
  para 0.455, topic gap 0.086, rank 4.9 (chead2 at 2100: 0.147 / 0.372 / -0.109 / 0.539 / 0.096 / 6.6).
  Largest leak cut that keeps retrieval; narrower. Provenance probe (length-matched) 0.59, not a shortcut.
clean_a_1gpu__clean_noconf__s42: >
  Clean A: as clean with the confounded rules dropped. Tests whether the late confounded rows are needed for
  retrieval. Done 2026-10-25. Step 2100: top-1 0.134, whitened 0.356, cgap +0.005, para 0.460, topic gap
  0.080, rank 4.9. Within noise of clean: the late confounded rows add nothing.
clean_a_1gpu__clean_mixed__s42: >
  Clean A: clean's time-averaged mix from step 0 (same exposure, no order). Tests whether clean-first order
  matters or only the mix. Done 2026-10-25. Step 2100: top-1 0.126, whitened 0.364, cgap -0.034, para
  0.518, topic gap 0.191, rank 4.1. Order cuts the leak (cgap, para); the mix doubles the topic-matched gap.
  One seed each.
clean_b_1gpu__pairs_data__s42: >
  Clean B (screen to 2100, compare with clean_a clean): clean_a's clean arm with msynthstel as 40 pole pairs x
  90 rows (was 32 x 32), cross-feature triplets dropped, the old trait hinge kept. Tests what more and cleaner
  trait rows do alone. Queued 2026-10-25.
clean_b_1gpu__tdir__s42: >
  Clean B: pairs data with a learned direction per pole pair from z(pole A) - z(pole B), where the sentence's
  content cancels (trait_direction_weight 1), trait hinge all but off. Tests whether the pairs teach style
  where the triplets (~0.9 violations) could not. Queued 2026-10-25.
clean_b_1gpu__tdir_w3__s42: >
  Clean B: as tdir at weight 3. Queued 2026-10-25.
conv_a_1gpu__v2_base__s42: >
  Conversation A (screen to 2100, v2 evaluation set, so compare only within conv_a): clean_a's clean recipe
  on genshin_v2.db, where each line's conversation (talk_id) is real. Topic-matched negatives are other
  speakers' lines from the anchor's own conversation (echoes dropped), far positives from other conversations;
  default 3 neighbours, 1 topic-matched triplet per anchor. The control. Queued 2026-10-25. Done 2026-10-26.
  Step 2100: top-1 0.149, whitened 0.370, cgap +0.112, para 0.405, topic gap 0.078, rank 4.7, content_rel_line
  +0.015 (speaker +0.067). Step 1050 was better on retrieval: top-1 0.195, rank 16.2.
conv_a_1gpu__v2_hard__s42: >
  Conversation A: v2_base with 8 neighbours and 3 topic-matched triplets per anchor (13.7k -> 36.5k train
  rows). Tests whether more same-conversation negatives cut the topic leak. Queued 2026-10-25. Done 2026-10-26.
  Step 2100: top-1 0.151, whitened 0.383, cgap -0.009, para 0.463, topic gap 0.089, rank 5.5, content_rel_line
  +0.010. Best whitened and rank of the three; the paraphrase sits closer (cgap +0.112 -> -0.009). Content
  relation small, positive, in band.
conv_a_1gpu__v2_conv__s42: >
  Conversation A: v2_hard plus train.conversation_group 4, so up to 4 rows per micro-batch share a
  conversation and InfoNCE's in-batch negatives share the anchor's topic. Tests the batch effect on top of
  the negatives. Queued 2026-10-25. Done 2026-10-26. 65% of Genshin rows grouped. Step 2100: top-1 0.140,
  whitened 0.371, cgap +0.071, para 0.421, topic gap 0.062, rank 5.0, content_rel_line +0.012 (no overshoot).
  No gain over v2_hard; grouping not worth keeping. All arms: top-1 falls ~0.045 and rank 13-16 -> 5 after
  InfoNCE stops at 1050. One seed.
nce_a_1gpu__nce_after_500__s42: >
  NCE A (screen to 2100, conv_a's evaluation set; compare with conv_a v2_hard, where InfoNCE stops at 1050):
  v2_hard with the hinge alone for steps 0-500, then InfoNCE + hinge to the end. Tests whether InfoNCE's
  paraphrase leak forms early, before clean structure exists, and whether keeping InfoNCE on avoids the
  1050 -> 2100 rank collapse (13-16 -> 5). Snapshots at 500 / 1050 / 1500 / 2100. Done 2026-10-27: at 2100
  top-1 0.169 (v2_hard 0.151), rank 10.0 (5.5), but the leak stays: cgap -0.066 (-0.009), para_beats_own 0.513
  (0.463), topic gap 0.041 (0.089); content_rel_line +0.013. Kept-on InfoNCE slows the narrowing, but the
  hinge-only phase is what repaired v2_hard's leak. Step 500 (hinge only) is still near the base model.
nce_a_1gpu__nce_ramp__s42: >
  NCE A: InfoNCE weight sqrt(step / 2100) from 0 (0.5 at 525, 0.71 at 1050, 1 at 2100), hinge x10 throughout.
  Tests a gradual onset with no switch. Done 2026-10-27 (validation re-run after the GPU dropped out): no leak
  (cgap +0.105, para_beats_own 0.421) but narrow and weak: top-1 0.139, rank 4.6 at 2100, already 5.2 at 500.
  With InfoNCE weak early the hinge narrows the space first and full-weight InfoNCE later never re-widens it.
nce_a_1gpu__nce_on_twin__s42: >
  NCE A: InfoNCE from 0 to 2100 plus each line's paraphrase as an InfoNCE candidate at T 0.05 (gradient
  checkpointing, ~1.5x time; T 0.03 cut the leak but ~40% of top-1, T 0.1 did nothing). Tests whether InfoNCE
  can counter its own leak. Done 2026-10-27 (re-queued after the GPU dropped out): best balance so far,
  top-1 0.189, rank 12.6 at 2100 (v2_hard 0.151 / 5.5), mild leak growing over the run (cgap +0.036 at 500,
  -0.048 at 2100; para_beats_own 0.496); content_rel_line +0.012.
nce_a_1gpu__nce_on__s42: >
  NCE A: InfoNCE from 0 to 2100, no other change; twin's direct reference. Done 2026-10-28: widest and highest
  top-1 (0.194, rank 14.6 at 2100) but the worst leak, growing all run (cgap -0.032 at 500, -0.098 at 2100;
  para_beats_own 0.554). The paraphrase candidate (nce_on_twin) halves the leak (-0.048) for ~0.005 top-1.
burst_a_1gpu__burst_1000__s42: >
  BURST A (screen to 2100, conv_a's evaluation set; compare with conv_a v2_hard): v2_hard (InfoNCE + hinge x10
  for 0-1050, hinge alone after) plus 100-step InfoNCE bursts on clean-only data at 1500-1600 and 1900-2000.
  Tests whether short bursts re-widen the space (v2_hard rank 14 -> 5.5 after 1050) while the hinge-only
  stretches keep repairing the paraphrase leak. Snapshots every 100 steps from 1000. Done 2026-10-29 (65 min,
  CNY 3.14): best leak-free run so far, top-1 0.169, rank 7.3, cgap +0.049, para_beats_own 0.434 at 2100
  (v2_hard 0.151 / 5.5 / -0.009). Each burst lifts rank (6.6 -> 9.9, 5.5 -> 8.2) and top-1 ~+0.02 with a brief
  small leak; 100-200 hinge steps undo both.
burst_a_1gpu__burst_1000_twin__s42: >
  BURST A: burst_1000 with each line's paraphrase as an InfoNCE candidate at T 0.05 in every InfoNCE window
  (gradient checkpointing). Combines the bursts with nce_a's best arm (nce_on_twin). Done 2026-10-29: same
  top-1 as burst_1000 (0.169) and wider (rank 10.4 vs 7.3, holds 8-10 between bursts) but a mild leak
  (cgap -0.022, para_beats_own 0.442) and a lower topic gap (0.064 vs 0.086); below nce_on_twin (0.189 / 12.6).
cap_a_1gpu__mid_layers__s42: >
  CAP A (screen to 2100, conv_a's evaluation set; compare with nce_a nce_on_twin, the same recipe): a learned
  softmax mix of hidden states 14/18/22/28 instead of the last layer. Tests whether style sits deeper in the
  network than the last layer exposes (top-1 at a given width). Done 2026-10-29 (77 min, CNY 3.71), INVALID:
  layers 14/18/22 entered the mix as raw residual stream (only 28 is post-norm), where channels 35/13/1 hold
  ~100% of the pooled energy; the fused input started at rank 1.2 and the run stayed collapsed (rank 2-3,
  top-1 0.122, cgap +0.137). Fixed in model.py (intermediate layers go through the backbone's final norm:
  rank 30 at init); needs a re-run.
cap_a_1gpu__lora_mlp__s42: >
  CAP A: LoRA rank 64 on the MLPs (gate/up/down_proj) as well as attention, ~2x the trainable parameters. Tests
  whether adapter capacity limits how much voice the model can represent. Done 2026-10-29 (90 min, CNY 4.30):
  top-1 0.220 and rank 25 at 2100 (nce_on_twin 0.189 / 12.6), but whitened top-1 is unchanged (0.380 vs 0.377)
  and the leak is the worst yet, growing all run (cgap -0.159, para_beats_own 0.632, topic gap 0.030):
  the extra capacity went to content, not voice.
cap_a_1gpu__mid_layers_norm__s42: >
  CAP A: mid_layers re-run after the fusion fix (layers 14/18/22 through the backbone's final norm; rank 30
  at init instead of 1.2). Same config; the first valid test of whether a layer mix raises top-1 at a given
  width against nce_on_twin. Done 2026-10-29 (slowed by a shared GPU): worse than the last layer alone,
  top-1 0.158, rank 9.1, topic gap 0.020 at 2100 (nce_on_twin 0.189 / 12.6 / 0.050); no leak (cgap -0.002,
  para_beats_own 0.477). Middle layers add no voice the last layer lacks.
clean_nce_a_1gpu__nce_clean__s42: >
  CLEAN NCE A (screen to 2100, conv_a's evaluation set; compare with nce_a nce_on): InfoNCE 0-2100 with only
  clean-tier rows as queries (train.infonce_tiers [clean]); topic and confounded rows stay candidates and keep
  the x10 hinge. Tests whether InfoNCE's width survives without its line-content leak (line_leak_heldout:
  nce_on_twin 0.700, v2_hard 0.641, 0.5 = none). Done 2026-10-29 (62 min, CNY 2.97): no cut in line leak
  (0.712 at 2100, rising from 0.680 at 500, where every row is still clean so the mask is inert). Keeps
  nce_on's width (rank 14.6, top-1 0.188) with less paraphrase leak (cgap -0.059 vs -0.098) and a lower
  topic gap (0.036). The leak comes from InfoNCE on clean pairs too, not from the topic or confounded rows.
clean_nce_a_1gpu__nce_clean_twin__s42: >
  CLEAN NCE A: nce_clean plus each line's paraphrase as an InfoNCE candidate at T 0.05 (gradient
  checkpointing); nce_on_twin with clean-only queries. The candidate for a leak-free nce_on_twin (0.189 / 12.6).
  Done 2026-10-30 (81 min, CNY 3.89): line leak 0.707 at 2100 (nce_on_twin 0.700), lower early (0.658 at
  500, 0.662 at 1050) but rising after; top-1 0.184, rank 14.6, cgap -0.026, para_beats_own 0.496, topic gap
  0.054. Wider than nce_on_twin at the same leak; clean-only queries do not stop the line leak.
scene_a_1gpu__scene4__s42: >
  SCENE A (screen to 2100, conv_a's evaluation set; compare with clean_nce_a nce_clean_twin): nce_clean_twin
  with train.conversation_group 4, so InfoNCE's in-batch candidates come in groups of up to 4 from the anchor's
  own conversation (different speakers) and topic no longer separates them. InfoNCE on all run (conv_a's
  v2_conv stopped it at 1050). Tests whether the line leak (nce_clean_twin 0.707) comes from easy cross-scene
  candidates.
  Done 2026-10-31 (76.5 min, CNY 3.67; 65% of anchors grouped): line leak 0.728 at 2100 (0.673 at 500, 0.682
  at 1050, 0.710 at 1500), above nce_clean_twin; top-1 0.167, rank 16.4, cgap -0.071, para_beats_own 0.515,
  topic gap 0.038. Same-conversation candidates do not cut the line leak, and identity gets worse.
scene_a_1gpu__scene8__s42: >
  SCENE A: scene4 with groups of 8 (4 conversations per 32-row micro-batch): the stronger dose of
