frozen_a: >
  FROZEN A (branch frozen-llm; no training; scene_a's evaluation set d-e7dd4c973f56): style vectors read off
  frozen LMs, scored by the same report as the trained runs. raw = mean hidden state; diff = hidden(line) minus
  hidden(its neutral rewrite by Qwen3-4B-Instruct-2507), as StyleVector (ACL 2025) builds steering vectors;
  persona = cosine of diff to 32 training speakers' mean diffs; cond = log p(line | neutral rewrite, 12 lines of
  one reference speaker), centred over 32 speakers. Encoders Qwen3-0.6B (our backbone), 1.7B, 4B-Instruct at
  1/2, 3/4 and all layers. Judged against nce_clean_twin (line leak 0.707, top-1 0.184) and the raw floor.
