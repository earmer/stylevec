runtime:
  mode: validate
  device: auto
  distributed: none
  precision: fp32
  seed: 42

paths:
  genshin_db: data/genshin/genshin.db
  top_speakers: data/paratarget/speakers_top100.json
  paratarget_jsonl: data/paratarget/generations_pairwise_validation_2p5cny.jsonl
  msynthstel_train: data/datasets/msynthstel/data/train-00000-of-00001.parquet
  msynthstel_test: data/datasets/msynthstel/data/test-00000-of-00001.parquet
  base_model: artifacts/base-models/qwen-3-0.6b

data:
  speakers: 100
  genshin_lines_per_speaker: 64
  paratarget_jobs: 20000
  paratarget_per_target_cap: 500
  paratarget_min_length_ratio: 0.5
  paratarget_max_length_ratio: 1.8
  msynthstel_features: 32
  msynthstel_rows_per_feature: 32
  min_chars: 2
  max_chars: 220
  max_triplets: 50000

model:
  base_model_path: artifacts/base-models/qwen-3-0.6b
  max_length: 192
  projection_dim: 256
  dropout: 0.05
  layer_fusion:
    mode: last
    layers: []
  lora:
    enabled: true
    rank: 64
    alpha: 128
    dropout: 0.05
    targets: [q_proj, k_proj, v_proj, o_proj]

weights:
  genshin_real: 1.0
  paratarget: 0.75
  msynthstel: 0.10

margins:
  easy: 0.08
  medium: 0.12
  hard: 0.18
  adversarial: 0.22

train:
  batch_size: 8
  grad_accum: 1
  max_steps: 1
  max_seconds: 0
  epochs: 1
  lr: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  num_workers: 0
  pin_memory: false
  rule_balanced_batches: false

regularization:
  variance_weight: 0.0
  covariance_weight: 0.0
  min_dim_std: 0.0

validation:
  batch_size: 8
  max_samples: 384
  max_triplets: 2048
  max_batches: 32
