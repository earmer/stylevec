# CLEAN NCE A: InfoNCE on clean rows only, for the whole run. In nce_a, InfoNCE on every row kept the space
# wide (nce_on rank 14.6, nce_on_twin 12.6) but leaked line content; the hinge alone stays clean but narrows
# (v2_hard rank 5.5). A head fitted after training could not separate the two (line leak rises with every
# top-1 gain), so the objective has to. Here InfoNCE queries only clean-tier rows (curriculum.RULE_CLEANLINESS:
# origin_vs_para, the paratarget and trait rules, where the anchor's content cannot pick the positive); topic
# and confounded rows stay in-batch candidates and keep the x10 hinge:
#   nce_clean       nce_a's nce_on with train.infonce_tiers [clean]
#   nce_clean_twin  nce_a's nce_on_twin (paraphrase candidate at T 0.05) with train.infonce_tiers [clean]
# No control arm: nce_a's nce_on / nce_on_twin are these recipes with every row a query, on the same data,
# seed and evaluation set. Judge by line_leak_heldout first (v2_hard 0.641, burst_1000 0.644, nce_on_twin 0.700;
# 0.5 = none), then top-1 and rank against nce_on_twin (0.189 / 12.6).
# uv run python expandtraining/2606/scripts/preflight.py local expandtraining/2606/configs/ablations/clean_nce_a_1gpu.yaml
name: clean_nce_a_1gpu
description: >
  nce_a's nce_on and nce_on_twin with InfoNCE limited to clean-tier rows (the hinge still on every row).
  Compare with nce_a on line_leak_heldout, then top-1, rank, cgap:origin_vs_para and the topic gap.
base: configs/remote_5090x2.yaml
world_size: 1
seeds: [42]
new_keys:
  - model.center
  - model.content_dim
  - model.gradient_checkpointing
  - train.loss
  - train.infonce_temperature
  - train.infonce_triplet_weight
  - train.infonce_until_step
  - train.infonce_tiers
  - train.infonce_twin_temperature
  - train.stop_at_step
  - regularization.content_weight
  - regularization.content_temperature
  - regularization.content_leak_weight
  - regularization.content_twin_pairs
  - validation.matryoshka_dims
  - data.genshin_source
  - data.genshin_scene_neighbors
  - data.genshin_topic_matched_variants
common:
  train.grad_accum: 8
  train.stop_at_step: 2100
  train.keep_weights_at: [0.1667, 0.35, 0.5, 0.70]
  model.center: running
  train.loss: infonce
  train.infonce_temperature: 0.05
  train.infonce_triplet_weight: 10.0
  train.infonce_until_step: 0
  train.infonce_tiers: [clean]
  validation.matryoshka_dims: [32, 64, 128]
  model.content_dim: 64
  regularization.content_weight: 0.5
  regularization.content_temperature: 0.1
  regularization.content_leak_weight: 0.05
  regularization.content_twin_pairs: true
  curriculum.mode: staged
  curriculum.grouping: cleanliness
  curriculum.stages:
    - {until: 0.20, tiers: {clean: 1.0}}
    - {until: 0.60, tiers: {clean: 0.6, topic: 0.4}}
    - {until: 1.00, tiers: {clean: 0.45, topic: 0.45, confounded: 0.10}}
  curriculum.rule_shares: {trait_positive_vs_negative: 0.25, trait_cross_feature_hard: 0.25,
                          length_course_genshin: 0.1, length_course_msynthstel: 0.1}
  data.genshin_source: v2
  # conv_a's evaluation set (built from its common data); every arm trains on v2_hard's negatives.
  data.genshin_scene_neighbors: 3
  data.genshin_topic_matched_variants: 1
arms:
  nce_clean:
    data.genshin_scene_neighbors: 8
    data.genshin_topic_matched_variants: 3
  nce_clean_twin:
    data.genshin_scene_neighbors: 8
    data.genshin_topic_matched_variants: 3
    train.infonce_twin_temperature: 0.05
    model.gradient_checkpointing: true
comparisons:
  - {arm: nce_clean_twin, against: nce_clean, isolates: paraphrase candidates in InfoNCE,
     keys: [train.infonce_twin_temperature, model.gradient_checkpointing]}
headline: [heldout_top1_macro, whitened_top1, line_leak_heldout, cgap:origin_vs_para, para_beats_own_heldout,
           gap:same_speaker_topic_matched, effective_rank, content_rel_line]
