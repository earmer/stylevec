# Clean B: msynthstel as minimal pairs, not triplets (#5). Every msynthstel row is one sentence at both poles of
# a feature ("Polite / Impolite"). As trait triplets (clean_a) the pair asks one feature to outweigh a whole
# shared sentence, and cross-feature negatives often share the anchor's feature: both rules sat at ~0.9
# violations. data.msynthstel_mode: pairs keeps all 40 pole pairs x 90 train rows (3,600, was 32 x 32), drops
# trait_cross_feature_hard and labels each row with its pole; regularization.trait_direction_weight learns one
# direction per pole pair from z(pole A) - z(pole B), where the shared content cancels
# (src/trait_directions.py). Base is clean_a's clean arm (cleanliness schedule on chead2), same screen
# (stop_at_step 2100 of 3000). The dataset changes, so batches are not step-matched with clean_a.
#   pairs_data  the pairs data with the old trait hinge (weight 0.10): what more and cleaner rows do alone
#   tdir        trait directions at weight 1, hinge all but off (weights.msynthstel 0.01)
#   tdir_w3     trait directions at weight 3
# Judge tdir against pairs_data by trait/accuracy and trait/own_cos (train) and by whether held-out retrieval
# and the leak columns hold; against clean_a clean for the rest.
# uv run python expandtraining/2606/scripts/preflight.py local expandtraining/2606/configs/ablations/clean_b_1gpu.yaml
name: clean_b_1gpu
description: >
  clean_a's clean arm with msynthstel as 40 pole pairs x 90 rows (cross-feature triplets dropped), with the old
  trait hinge or with a learned direction per pole pair from the pair difference (weight 1 and 3). Screens to
  step 2100. Judge the trait directions' accuracy against held-out retrieval and the leak columns.
base: configs/remote_5090x2.yaml
world_size: 1
seeds: [42]
new_keys:
  - model.center
  - model.content_dim
  - train.loss
  - train.infonce_temperature
  - train.infonce_triplet_weight
  - train.infonce_until_step
  - train.stop_at_step
  - regularization.content_weight
  - regularization.content_temperature
  - regularization.content_leak_weight
  - regularization.content_twin_pairs
  - validation.matryoshka_dims
  - regularization.trait_direction_weight
  - data.msynthstel_mode
common:
  train.grad_accum: 8
  train.stop_at_step: 2100
  model.center: running
  train.loss: infonce
  train.infonce_temperature: 0.05
  train.infonce_triplet_weight: 10.0
  train.infonce_until_step: 1050
  validation.matryoshka_dims: [32, 64, 128]
  model.content_dim: 64
  regularization.content_weight: 0.5
  regularization.content_temperature: 0.1
  regularization.content_leak_weight: 0.05
  regularization.content_twin_pairs: true
  curriculum.mode: staged
  curriculum.grouping: cleanliness
  # Stated here: the base's stages name easy/mid/hard. Same as curriculum.CLEAN_STAGES.
  curriculum.stages:
    - {until: 0.20, tiers: {clean: 1.0}}
    - {until: 0.60, tiers: {clean: 0.6, topic: 0.4}}
    - {until: 1.00, tiers: {clean: 0.45, topic: 0.45, confounded: 0.10}}
  curriculum.rule_shares: {trait_positive_vs_negative: 0.5,
                          length_course_genshin: 0.1, length_course_msynthstel: 0.1}
  data.msynthstel_mode: pairs
  data.msynthstel_features: 0
  data.msynthstel_rows_per_feature: 90
arms:
  pairs_data: {}
  tdir:
    weights.msynthstel: 0.01
    regularization.trait_direction_weight: 1.0
  tdir_w3:
    weights.msynthstel: 0.01
    regularization.trait_direction_weight: 3.0
comparisons:
  - {arm: tdir, against: pairs_data, isolates: trait directions instead of the trait hinge,
     keys: [weights.msynthstel, regularization.trait_direction_weight]}
  - {arm: tdir_w3, against: tdir, isolates: trait direction weight}
headline: [heldout_top1_macro, whitened_top1, cgap:origin_vs_para, gap:origin_vs_para, para_beats_own_heldout,
           gap:same_speaker_topic_matched, effective_rank]
