# SCENE A: InfoNCE whose in-batch candidates share the anchor's conversation. In clean_nce_a, limiting
# InfoNCE's queries to clean rows left the line leak at 0.71 (nce_clean_twin 0.707, nce_on_twin 0.700; v2_hard
# 0.641, 0.5 = none) and it was already 0.66-0.68 at step 500, when every row is clean: the in-batch contrast
# itself rewards line content, because the other ~95 candidates come from unrelated scenes and content tells
# them apart. train.conversation_group k swaps rows within each micro-batch so Genshin anchors come in groups
# of up to k from one conversation (genshin v2 talk_id) with different speakers: topic no longer separates
# them, only voice does. conv_a's v2_conv tested k 4 only with InfoNCE stopping at 1050 (no gain at 2100 after
# the hinge phase; line leak not measured then). Here InfoNCE runs the whole screen:
#   scene4  clean_nce_a's nce_clean_twin with train.conversation_group 4
#   scene8  the same with groups of 8 (4 conversations per 32-row micro-batch)
# No control arm: nce_clean_twin is this recipe with conversation_group 0, on the same data, seed and
# evaluation set. Judge by line_leak_heldout first, then top-1, rank and the topic gap against it
# (0.707 / 0.184 / 14.6 / 0.054).
# uv run python expandtraining/2606/scripts/preflight.py local expandtraining/2606/configs/ablations/scene_a_1gpu.yaml
name: scene_a_1gpu
description: >
  clean_nce_a's nce_clean_twin with same-conversation micro-batches (groups of 4 and 8) and InfoNCE on for the
  whole screen. Compare with nce_clean_twin on line_leak_heldout, then top-1, rank and the topic gap.
base: configs/remote_5090x2.yaml
world_size: 1
seeds: [42]
new_keys:
  - model.center
  - model.content_dim
  - model.gradient_checkpointing
  - train.loss
  - train.infonce_temperature
  - train.infonce_triplet_weight
  - train.infonce_until_step
  - train.infonce_tiers
  - train.conversation_group
  - train.infonce_twin_temperature
  - train.stop_at_step
  - regularization.content_weight
  - regularization.content_temperature
  - regularization.content_leak_weight
  - regularization.content_twin_pairs
  - validation.matryoshka_dims
  - data.genshin_source
  - data.genshin_scene_neighbors
  - data.genshin_topic_matched_variants
common:
  train.grad_accum: 8
  train.stop_at_step: 2100
  train.keep_weights_at: [0.1667, 0.35, 0.5, 0.70]
  model.center: running
  train.loss: infonce
  train.infonce_temperature: 0.05
  train.infonce_triplet_weight: 10.0
  train.infonce_until_step: 0
  train.infonce_tiers: [clean]
  train.infonce_twin_temperature: 0.05
  model.gradient_checkpointing: true
  validation.matryoshka_dims: [32, 64, 128]
  model.content_dim: 64
  regularization.content_weight: 0.5
  regularization.content_temperature: 0.1
  regularization.content_leak_weight: 0.05
  regularization.content_twin_pairs: true
  curriculum.mode: staged
  curriculum.grouping: cleanliness
  curriculum.stages:
    - {until: 0.20, tiers: {clean: 1.0}}
    - {until: 0.60, tiers: {clean: 0.6, topic: 0.4}}
    - {until: 1.00, tiers: {clean: 0.45, topic: 0.45, confounded: 0.10}}
  curriculum.rule_shares: {trait_positive_vs_negative: 0.25, trait_cross_feature_hard: 0.25,
                          length_course_genshin: 0.1, length_course_msynthstel: 0.1}
  data.genshin_source: v2
  # conv_a's evaluation set (built from its common data); every arm trains on v2_hard's negatives.
  data.genshin_scene_neighbors: 3
  data.genshin_topic_matched_variants: 1
arms:
  scene4:
    train.conversation_group: 4
    data.genshin_scene_neighbors: 8
    data.genshin_topic_matched_variants: 3
  scene8:
    train.conversation_group: 8
    data.genshin_scene_neighbors: 8
    data.genshin_topic_matched_variants: 3
comparisons:
  - {arm: scene8, against: scene4, isolates: conversation group size}
headline: [heldout_top1_macro, whitened_top1, line_leak_heldout, cgap:origin_vs_para, para_beats_own_heldout,
           gap:same_speaker_topic_matched, effective_rank, content_rel_line]
