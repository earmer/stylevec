# CAP A: does the model represent more of voice? nce_a's nce_on_twin (InfoNCE + hinge x10 for 0-2100, each
# line's paraphrase as an InfoNCE candidate at T 0.05) is the base: top-1 0.189, rank 12.6, cgap -0.048 at 2100.
# The same weights reach rank 14-16 under InfoNCE and ~5 under the hinge, so width is set by the objective, not
# capacity; these arms test whether more capacity raises the ceiling (top-1 at a given width):
#   mid_layers  a learned softmax-weighted mix of hidden states 14, 18, 22 and 28 (28 = the last layer's output)
#               instead of the last layer alone
#   lora_mlp    LoRA rank 64 also on the MLPs (gate/up/down_proj), ~2x the trainable parameters
# No control arm: nce_a's nce_on_twin is this recipe on the same dataset and evaluation set. Each run is capped
# at CNY 6 by run_queue (lora_mlp is the slowest; twin alone took 79 min).
# uv run python expandtraining/2606/scripts/preflight.py local expandtraining/2606/configs/ablations/cap_a_1gpu.yaml
name: cap_a_1gpu
description: >
  nce_a's nce_on_twin with a learned mix of layers 14/18/22/28, or LoRA on the MLPs as well as attention.
  Compare with nce_a nce_on_twin on top-1, whitened top-1, rank, cgap:origin_vs_para and content_rel_line.
base: configs/remote_5090x2.yaml
world_size: 1
seeds: [42]
new_keys:
  - model.center
  - model.content_dim
  - model.gradient_checkpointing
  - train.loss
  - train.infonce_temperature
  - train.infonce_triplet_weight
  - train.infonce_until_step
  - train.infonce_twin_temperature
  - train.stop_at_step
  - regularization.content_weight
  - regularization.content_temperature
  - regularization.content_leak_weight
  - regularization.content_twin_pairs
  - validation.matryoshka_dims
  - data.genshin_source
  - data.genshin_scene_neighbors
  - data.genshin_topic_matched_variants
common:
  train.grad_accum: 8
  train.stop_at_step: 2100
  train.keep_weights_at: [0.1667, 0.35, 0.5, 0.70]
  model.center: running
  train.loss: infonce
  train.infonce_temperature: 0.05
  train.infonce_triplet_weight: 10.0
  train.infonce_until_step: 0
  validation.matryoshka_dims: [32, 64, 128]
  model.content_dim: 64
  regularization.content_weight: 0.5
  regularization.content_temperature: 0.1
  regularization.content_leak_weight: 0.05
  regularization.content_twin_pairs: true
  curriculum.mode: staged
  curriculum.grouping: cleanliness
  curriculum.stages:
    - {until: 0.20, tiers: {clean: 1.0}}
    - {until: 0.60, tiers: {clean: 0.6, topic: 0.4}}
    - {until: 1.00, tiers: {clean: 0.45, topic: 0.45, confounded: 0.10}}
  curriculum.rule_shares: {trait_positive_vs_negative: 0.25, trait_cross_feature_hard: 0.25,
                          length_course_genshin: 0.1, length_course_msynthstel: 0.1}
  data.genshin_source: v2
  # conv_a's evaluation set (built from its common data); every arm trains on v2_hard's negatives.
  data.genshin_scene_neighbors: 3
  data.genshin_topic_matched_variants: 1
arms:
  mid_layers:
    data.genshin_scene_neighbors: 8
    data.genshin_topic_matched_variants: 3
    train.infonce_twin_temperature: 0.05
    model.gradient_checkpointing: true
    model.layer_fusion.mode: weighted_sum
    model.layer_fusion.layers: [14, 18, 22, 28]
  lora_mlp:
    data.genshin_scene_neighbors: 8
    data.genshin_topic_matched_variants: 3
    train.infonce_twin_temperature: 0.05
    model.gradient_checkpointing: true
    model.lora.targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
comparisons:
  - {arm: lora_mlp, against: mid_layers, isolates: MLP adapters vs a layer mix,
     keys: [model.layer_fusion.mode, model.layer_fusion.layers, model.lora.targets]}
headline: [heldout_top1_macro, whitened_top1, cgap:origin_vs_para, para_beats_own_heldout,
           gap:same_speaker_topic_matched, effective_rank, content_rel_line]
