# HEAD D: named (explainable) trait dimensions (src/named_traits.py). Jev (TypeSafe's System One model) scored
# 10k training lines and their own neutral paraphrases on 17 style traits (src/traits.py, 0..4, 2 = neutral or
# not applicable); each step a side batch of 64 of them trains embedding dim t to correlate with trait t.
#   named  nohead's recipe plus named_trait_weight 0.5
# Judge against nohead s42/s43 (leak 0.662/0.645, top-1 0.178/0.162) on line_leak_heldout, top-1, Fisher metrics,
# and per-trait correlation of dim t with Jev's score on held-out speakers (outputs/traits/genshin_val.jsonl).
# uv run python expandtraining/2606/scripts/preflight.py local expandtraining/2606/configs/ablations/head_d_1gpu.yaml
name: head_d_1gpu
description: >
  nohead plus named trait dimensions: embedding dims 0..16 trained to correlate with Jev's 17 style traits
  (formality, archaic, ... nonstandard) on 10k training lines and their own paraphrases. Compare with nohead on
  line_leak_heldout, top-1 and Fisher separability; read the named dims against Jev labels on held-out speakers.
base: configs/remote_5090x2.yaml
world_size: 1
seeds: [42]
new_keys:
  - model.center
  - model.content_dim
  - model.gradient_checkpointing
  - train.loss
  - train.infonce_temperature
  - train.infonce_triplet_weight
  - train.infonce_until_step
  - train.infonce_tiers
  - train.infonce_twin_temperature
  - train.stop_at_step
  - regularization.content_weight
  - regularization.content_temperature
  - regularization.content_leak_weight
  - regularization.content_twin_pairs
  - validation.matryoshka_dims
  - data.genshin_source
  - data.genshin_scene_neighbors
  - data.genshin_topic_matched_variants
  - train.named_trait_weight
  - train.named_trait_files
  - train.named_trait_batch
common:
  train.grad_accum: 8
  train.stop_at_step: 2100
  train.keep_weights_at: [0.1667, 0.35, 0.5, 0.70]
  model.center: running
  train.loss: infonce
  train.infonce_temperature: 0.05
  train.infonce_triplet_weight: 10.0
  train.infonce_until_step: 0
  train.infonce_tiers: [clean]
  train.infonce_twin_temperature: 0.05
  model.gradient_checkpointing: true
  validation.matryoshka_dims: [32, 64, 128]
  model.content_dim: 64
  regularization.content_weight: 0.5
  regularization.content_temperature: 0.1
  regularization.content_leak_weight: 0.05
  regularization.content_twin_pairs: true
  curriculum.mode: staged
  curriculum.grouping: cleanliness
  curriculum.stages:
    - {until: 0.20, tiers: {clean: 1.0}}
    - {until: 0.60, tiers: {clean: 0.6, topic: 0.4}}
    - {until: 1.00, tiers: {clean: 0.45, topic: 0.45, confounded: 0.10}}
  curriculum.rule_shares: {trait_positive_vs_negative: 0.25, trait_cross_feature_hard: 0.25,
                          length_course_genshin: 0.1, length_course_msynthstel: 0.1}
  data.genshin_source: v2
  # conv_a's evaluation set (built from its common data); every arm trains on v2_hard's negatives.
  data.genshin_scene_neighbors: 3
  data.genshin_topic_matched_variants: 1
arms:
  named:
    data.genshin_scene_neighbors: 8
    data.genshin_topic_matched_variants: 3
    model.content_dim: 0
    regularization.content_weight: 0.0
    regularization.content_leak_weight: 0.0
    regularization.content_twin_pairs: false
    train.named_trait_weight: 0.5
    train.named_trait_files: [data/traits/genshin_train.jsonl]
    train.named_trait_batch: 64
comparisons: []
headline: [heldout_top1_macro, line_leak_heldout, fisher_sep, fisher_rank, fisher_sep_diff, fisher_sep_para,
           effective_rank, gap:same_speaker_topic_matched, content_rel_line]
