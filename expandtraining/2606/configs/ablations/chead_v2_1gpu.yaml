# Leak E: the content head, repaired. One seed on one 5090; base is infonce_d's nce_stage1 (InfoNCE + hinge
# for stage 1, then the hinge), so compare with infonce_d_1gpu__nce_stage1__s42 (final top-1 0.161,
# cgap:origin_vs_para -0.040, para_beats_own 0.534) and with infonce_b's chead (top-1 0.194, whitened 0.353,
# rank 18.8, but origin_vs_para gap -0.178).
#
# chead's head learned content (pair accuracy ~0.95) yet the style side kept it, for three fixable reasons:
#   1. InfoNCE ran all 3000 steps (the base here stops it at 1050);
#   2. an 8-dim code cannot say which line is which, and its linear leak penalty sat at the batch noise
#      floor: the head is 64 wide here;
#   3. the head trained on ~31% of rows: content_twin_pairs adds every row with a content twin (~63%),
#      anchor -> detached twin.
# chead2_orth adds content_orthogonal_weight: the style projection and the content head must read orthogonal
# directions of the pooled hidden state (random heads: ~256 / hidden). A weight constraint, so no noise
# floor; it separates what each head reads, not where the information lives.
# An instance-level leak term (leak A or B) on top is the obvious follow-up once those screen.
# uv run python expandtraining/2606/scripts/preflight.py local expandtraining/2606/configs/ablations/chead_v2_1gpu.yaml
name: chead_v2_1gpu
description: >
  nce_stage1 plus a 64-dim content head trained on every row with a content twin and the linear leak
  penalty, with and without an orthogonality constraint between the style and content heads. Judge by the
  centered origin_vs_para gap and paraphrase rank against held-out retrieval, at step 3000.
base: configs/remote_5090x2.yaml
world_size: 1
seeds: [42]
new_keys:
  - model.center
  - model.content_dim
  - train.loss
  - train.infonce_temperature
  - train.infonce_triplet_weight
  - train.infonce_until_step
  - regularization.content_weight
  - regularization.content_temperature
  - regularization.content_leak_weight
  - regularization.content_twin_pairs
  - regularization.content_orthogonal_weight
  - validation.matryoshka_dims
common:
  train.grad_accum: 8
  curriculum.mode: staged
  model.center: running
  train.loss: infonce
  train.infonce_temperature: 0.05
  train.infonce_triplet_weight: 10.0
  train.infonce_until_step: 1050
  validation.matryoshka_dims: [32, 64, 128]
  model.content_dim: 64
  regularization.content_weight: 0.5
  regularization.content_temperature: 0.1
  regularization.content_leak_weight: 0.05
  regularization.content_twin_pairs: true
arms:
  chead2: {}
  chead2_orth:
    regularization.content_orthogonal_weight: 1.0
comparisons:
  - {arm: chead2_orth, against: chead2, isolates: orthogonal style and content heads}
headline: [heldout_top1_macro, whitened_top1, cgap:origin_vs_para, gap:origin_vs_para, para_beats_own_heldout,
           gap:same_speaker_topic_matched, effective_rank]
