# HEAD A: is the content head the line-leak source? Every leak screen since infonce_b trains a 64-d content head on
# the shared encoder (regularization.content_weight 0.5): it pulls each line toward its content twin, its own
# paraphrase (content_twin_pairs: ~63% of rows), while the style head reads the same trunk. Nothing else in the
# objective pulls a line toward its paraphrase (origin_vs_para's paraphrase is a negative), and changing which rows
# are queries (clean_nce_a) or which candidates they meet (scene_a) left the line leak at 0.71, and no frozen-LM
# vector (frozen_a) beats the trained one at matched leak. Arms, both nce_clean_twin otherwise:
#   nohead  no content head (model.content_dim 0, content and leak weights 0)
#   notwin  the head trained only on the pair rules (~31% of rows), as before chead_v2
# No control arm: nce_clean_twin is this recipe with the head and twin pairs on, same data, seed and evaluation
# set. Judge by line_leak_heldout first, then top-1, whitened top-1 and rank (0.707 / 0.184 / 0.357 / 14.6).
# uv run python expandtraining/2606/scripts/preflight.py local expandtraining/2606/configs/ablations/head_a_1gpu.yaml
name: head_a_1gpu
description: >
  clean_nce_a's nce_clean_twin without the content head (nohead) and with the head on pair rules only (notwin).
  Compare with nce_clean_twin on line_leak_heldout, then top-1, whitened top-1 and rank.
base: configs/remote_5090x2.yaml
world_size: 1
seeds: [42]
new_keys:
  - model.center
  - model.content_dim
  - model.gradient_checkpointing
  - train.loss
  - train.infonce_temperature
  - train.infonce_triplet_weight
  - train.infonce_until_step
  - train.infonce_tiers
  - train.infonce_twin_temperature
  - train.stop_at_step
  - regularization.content_weight
  - regularization.content_temperature
  - regularization.content_leak_weight
  - regularization.content_twin_pairs
  - validation.matryoshka_dims
  - data.genshin_source
  - data.genshin_scene_neighbors
  - data.genshin_topic_matched_variants
common:
  train.grad_accum: 8
  train.stop_at_step: 2100
  train.keep_weights_at: [0.1667, 0.35, 0.5, 0.70]
  model.center: running
  train.loss: infonce
  train.infonce_temperature: 0.05
  train.infonce_triplet_weight: 10.0
  train.infonce_until_step: 0
  train.infonce_tiers: [clean]
  train.infonce_twin_temperature: 0.05
  model.gradient_checkpointing: true
  validation.matryoshka_dims: [32, 64, 128]
  model.content_dim: 64
  regularization.content_weight: 0.5
  regularization.content_temperature: 0.1
  regularization.content_leak_weight: 0.05
  regularization.content_twin_pairs: true
  curriculum.mode: staged
  curriculum.grouping: cleanliness
  curriculum.stages:
    - {until: 0.20, tiers: {clean: 1.0}}
    - {until: 0.60, tiers: {clean: 0.6, topic: 0.4}}
    - {until: 1.00, tiers: {clean: 0.45, topic: 0.45, confounded: 0.10}}
  curriculum.rule_shares: {trait_positive_vs_negative: 0.25, trait_cross_feature_hard: 0.25,
                          length_course_genshin: 0.1, length_course_msynthstel: 0.1}
  data.genshin_source: v2
  # conv_a's evaluation set (built from its common data); every arm trains on v2_hard's negatives.
  data.genshin_scene_neighbors: 3
  data.genshin_topic_matched_variants: 1
arms:
  nohead:
    data.genshin_scene_neighbors: 8
    data.genshin_topic_matched_variants: 3
    model.content_dim: 0
    regularization.content_weight: 0.0
    regularization.content_leak_weight: 0.0
    regularization.content_twin_pairs: false
  notwin:
    data.genshin_scene_neighbors: 8
    data.genshin_topic_matched_variants: 3
    regularization.content_twin_pairs: false
comparisons:
  - {arm: nohead, against: notwin, isolates: the content head on pair rules,
     keys: [model.content_dim, regularization.content_weight, regularization.content_leak_weight]}
headline: [heldout_top1_macro, whitened_top1, line_leak_heldout, cgap:origin_vs_para, para_beats_own_heldout,
           gap:same_speaker_topic_matched, effective_rank, content_rel_line]
