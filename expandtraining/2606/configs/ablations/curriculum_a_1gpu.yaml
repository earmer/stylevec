# Round A's two central questions on one 5090, one seed each: does the tier re-weighting help
# (mixed vs uniform), and does the ordering help beyond it (staged vs mixed)? ~5 h on a 1x5090.
# grad_accum doubles (4 -> 8) so a step covers the same 256 rows as on 2x5090; max_steps sized to the box.
# uv run python expandtraining/2606/scripts/preflight.py local expandtraining/2606/configs/ablations/curriculum_a_1gpu.yaml
name: curriculum_a_1gpu
description: >
  uniform -> mixed isolates the tier re-weighting; mixed -> staged isolates the ordering at equal
  exposure, as in curriculum_a, on a single GPU.
  One seed per arm is a screening read only; the verdict rule needs the 3-seed rounds.
base: configs/remote_5090x2.yaml
world_size: 1
seeds: [42]
common:
  train.grad_accum: 8
arms:
  uniform: {curriculum.mode: uniform}
  mixed: {curriculum.mode: mixed}
  staged: {curriculum.mode: staged}
comparisons:
  - {arm: mixed, against: uniform, isolates: exposure}
  - {arm: staged, against: mixed, isolates: order}
headline: [heldout_top1_lift, provenance_acc, gap:same_speaker_topic_matched, gap:origin_vs_para]
