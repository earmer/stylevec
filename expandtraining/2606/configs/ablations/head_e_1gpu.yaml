# HEAD E: head_d's named trait dimensions, now trained on same-content PAIRS (src/named_traits.py pair mode):
# 1,200 line/own-paraphrase, 1,145 line/tone-twin (scripts/genshin_tone_rewrite.py) and 2,270 book passage/style
# rewrite pairs (scripts/book_style_rewrite.py), all Jev-scored on both sides (scripts/trait_pairs.py
# --max-para 1200). Per-text correlation plus within-pair-difference correlation per trait, and a norm floor:
# head_d's named block sank to 1.6% of the squared norm (17 dims at min_dim_std 0.03 = 1.5%), so it barely moved
# cosine. The 17-d prefix is also a Matryoshka prefix, so the named block must separate speakers on its own.
#   paired  head_d plus pairs, named_trait_norm_floor 0.12, matryoshka [17, 32, 64, 128]; stops at 1050
# Judge against head_d and nohead at step 1050: per-trait r on line - paraphrase (head_d final: mean 0.49, tone
# traits 0.11-0.24), fisher_sep_diff (head_d 1.49, nohead 2.73), top-1 and leak within seed noise of nohead.
# uv run python expandtraining/2606/scripts/preflight.py local expandtraining/2606/configs/ablations/head_e_1gpu.yaml
name: head_e_1gpu
description: >
  head_d's named trait dimensions trained on Jev-scored same-content pairs (paraphrase, tone twin, book style
  rewrite) with a within-pair difference loss, a norm floor on the named block and a 17-d Matryoshka prefix.
  Compare with head_d and nohead at step 1050 on per-trait r, sep_diff, top-1 and leak.
base: configs/remote_5090x2.yaml
world_size: 1
seeds: [42]
new_keys:
  - model.center
  - model.content_dim
  - model.gradient_checkpointing
  - train.loss
  - train.infonce_temperature
  - train.infonce_triplet_weight
  - train.infonce_until_step
  - train.infonce_tiers
  - train.infonce_twin_temperature
  - train.stop_at_step
  - regularization.content_weight
  - regularization.content_temperature
  - regularization.content_leak_weight
  - regularization.content_twin_pairs
  - validation.matryoshka_dims
  - data.genshin_source
  - data.genshin_scene_neighbors
  - data.genshin_topic_matched_variants
  - train.named_trait_weight
  - train.named_trait_files
  - train.named_trait_batch
  - train.named_trait_pair_files
  - train.named_trait_norm_floor
common:
  train.grad_accum: 8
  train.stop_at_step: 1050
  train.keep_weights_at: [0.1667, 0.35]
  model.center: running
  train.loss: infonce
  train.infonce_temperature: 0.05
  train.infonce_triplet_weight: 10.0
  train.infonce_until_step: 0
  train.infonce_tiers: [clean]
  train.infonce_twin_temperature: 0.05
  model.gradient_checkpointing: true
  validation.matryoshka_dims: [17, 32, 64, 128]
  regularization.matryoshka_dims: [17, 32, 64, 128]
  model.content_dim: 64
  regularization.content_weight: 0.5
  regularization.content_temperature: 0.1
  regularization.content_leak_weight: 0.05
  regularization.content_twin_pairs: true
  curriculum.mode: staged
  curriculum.grouping: cleanliness
  curriculum.stages:
    - {until: 0.20, tiers: {clean: 1.0}}
    - {until: 0.60, tiers: {clean: 0.6, topic: 0.4}}
    - {until: 1.00, tiers: {clean: 0.45, topic: 0.45, confounded: 0.10}}
  curriculum.rule_shares: {trait_positive_vs_negative: 0.25, trait_cross_feature_hard: 0.25,
                          length_course_genshin: 0.1, length_course_msynthstel: 0.1}
  data.genshin_source: v2
  # conv_a's evaluation set (built from its common data); every arm trains on v2_hard's negatives.
  data.genshin_scene_neighbors: 3
  data.genshin_topic_matched_variants: 1
arms:
  paired:
    data.genshin_scene_neighbors: 8
    data.genshin_topic_matched_variants: 3
    model.content_dim: 0
    regularization.content_weight: 0.0
    regularization.content_leak_weight: 0.0
    regularization.content_twin_pairs: false
    train.named_trait_weight: 0.5
    train.named_trait_files: []
    train.named_trait_pair_files: [data/traits/trait_pairs_train.jsonl]
    train.named_trait_norm_floor: 0.12
    train.named_trait_batch: 64
comparisons: []
headline: [heldout_top1_macro, line_leak_heldout, fisher_sep, fisher_rank, fisher_sep_diff, fisher_sep_para,
           effective_rank, gap:same_speaker_topic_matched, content_rel_line]
