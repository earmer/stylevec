# Clean A: order the data by cleanliness, not difficulty (#5). The easy/mid/hard curriculum put confounded
# rules (same_speaker_real, length_course_*) in its first stage, so the content shortcut was learned from
# step 0 and every leak fix in #1 had to undo it. curriculum.grouping: cleanliness groups rules by whether the
# anchor's content alone can pick the positive (src/curriculum.py):
#   clean       origin_vs_para, the paratarget rules, the msynthstel trait rules
#   topic       same_speaker_topic_matched (the negative shares the scene)
#   confounded  same_speaker_real, length_course_*
# Stages: clean only until 0.20, then clean/topic 0.6/0.4 until 0.60, then 0.45/0.45/0.10 confounded.
# Rule shares: the trait rules (1,024 rows each) would repeat ~70x at share 1, so 0.25; length_course_* (1,000
# rows each) would take 2/3 of the confounded tier, so 0.1.
#
# Base is chead2 (chead_v2_1gpu: nce_stage1 + 64-d content head on every twin row). Screen: train.stop_at_step
# 2100 with lr and curriculum laid out over max_steps 3000, so compare step 1050 and 2100 with
# chead_v2_1gpu__chead2__s42's validation_step_01050 / validation_step_02100 (whitened 0.410 at 1050).
#   clean          the cleanliness schedule
#   clean_noconf   confounded rules dropped: are the 10% late confounded rows needed for retrieval?
#   clean_mixed    clean's time-averaged mix from step 0: same exposure, no order (is it order or composition?)
# uv run python expandtraining/2606/scripts/preflight.py local expandtraining/2606/configs/ablations/clean_a_1gpu.yaml
name: clean_a_1gpu
description: >
  chead2 with the curriculum grouped by cleanliness (clean / topic / confounded) instead of difficulty:
  clean-first, clean-first without confounded rules, and the same exposure without order. Screens to step 2100.
  Judge by cgap:origin_vs_para and para_beats_own_heldout against heldout and whitened top-1.
base: configs/remote_5090x2.yaml
world_size: 1
seeds: [42]
new_keys:
  - model.center
  - model.content_dim
  - train.loss
  - train.infonce_temperature
  - train.infonce_triplet_weight
  - train.infonce_until_step
  - train.stop_at_step
  - regularization.content_weight
  - regularization.content_temperature
  - regularization.content_leak_weight
  - regularization.content_twin_pairs
  - validation.matryoshka_dims
common:
  train.grad_accum: 8
  train.stop_at_step: 2100
  model.center: running
  train.loss: infonce
  train.infonce_temperature: 0.05
  train.infonce_triplet_weight: 10.0
  train.infonce_until_step: 1050
  validation.matryoshka_dims: [32, 64, 128]
  model.content_dim: 64
  regularization.content_weight: 0.5
  regularization.content_temperature: 0.1
  regularization.content_leak_weight: 0.05
  regularization.content_twin_pairs: true
  curriculum.mode: staged
  curriculum.grouping: cleanliness
  # Stated here: the base's stages name easy/mid/hard. Same as curriculum.CLEAN_STAGES.
  curriculum.stages:
    - {until: 0.20, tiers: {clean: 1.0}}
    - {until: 0.60, tiers: {clean: 0.6, topic: 0.4}}
    - {until: 1.00, tiers: {clean: 0.45, topic: 0.45, confounded: 0.10}}
  curriculum.rule_shares: {trait_positive_vs_negative: 0.25, trait_cross_feature_hard: 0.25,
                          length_course_genshin: 0.1, length_course_msynthstel: 0.1}
arms:
  clean: {}
  clean_noconf:
    curriculum.tiers: {same_speaker_real: drop, length_course_genshin: drop, length_course_msynthstel: drop}
  clean_mixed:
    curriculum.mode: mixed
comparisons:
  - {arm: clean_noconf, against: clean, isolates: the late confounded rows,
     keys: [curriculum.tiers.same_speaker_real, curriculum.tiers.length_course_genshin, curriculum.tiers.length_course_msynthstel]}
  - {arm: clean_mixed, against: clean, isolates: clean-first order (same exposure)}
headline: [heldout_top1_macro, whitened_top1, cgap:origin_vs_para, gap:origin_vs_para, para_beats_own_heldout,
           gap:same_speaker_topic_matched, effective_rank]
