runtime:
  mode: train
  device: cuda
  distributed: accelerate
  precision: bf16
  seed: 42

paths:
  genshin_db: data/genshin/genshin.db
  top_speakers: data/paratarget/speakers_top100.json
  paratarget_jsonl: data/paratarget/generations_pairwise_validation_2p5cny.jsonl
  msynthstel_train: data/datasets/msynthstel/data/train-00000-of-00001.parquet
  msynthstel_test: data/datasets/msynthstel/data/test-00000-of-00001.parquet
  base_model: artifacts/base-models/qwen-3-0.6b

data:
  speakers: 100
  heldout_speakers: 20
  genshin_min_id_gap: 150
  genshin_scene_window: 12
  genshin_candidates: 24
  same_content_diff_style_enabled: false
  # 256 lines (not 64) and a 150k cap (not 50k): the hard tier (same_speaker_topic_matched) grows from
  # 3,535 to ~13.6k train triplets, ~14x reuse instead of ~55x (CURRICULUM.md §4), and the held-out
  # validation pool roughly quadruples.
  genshin_lines_per_speaker: 256
  paratarget_jobs: 20000
  paratarget_per_target_cap: 500
  paratarget_min_length_ratio: 0.5
  paratarget_max_length_ratio: 1.8
  paratarget_original_push_enabled: true
  msynthstel_features: 32
  msynthstel_rows_per_feature: 32
  min_chars: 2
  max_chars: 220
  max_triplets: 150000
  length_course_enabled: true
  length_course_triplets_per_domain: 1000
  length_course_parts: 2
  length_course_max_chars: 4000

model:
  base_model_path: artifacts/base-models/qwen-3-0.6b
  max_length: 192
  projection_dim: 256
  dropout: 0.05
  layer_fusion:
    mode: last
    layers: []
  lora:
    enabled: true
    rank: 64
    alpha: 128
    dropout: 0.05
    targets: [q_proj, k_proj, v_proj, o_proj]

weights:
  genshin_real: 1.0
  genshin_topic_matched: 1.0
  paratarget: 0.75
  paratarget_original_push: 0.08
  msynthstel: 0.10
  length_course: 0.08

margins:
  easy: 0.08
  medium: 0.12
  hard: 0.18
  adversarial: 0.22

train:
  batch_size: 32
  grad_accum: 4
  max_steps: 3000
  epochs: 3
  lr: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  num_workers: 8
  pin_memory: true
  prefetch_factor: 4
  persistent_workers: false
  combine_triplet_forward: true
  fused_adamw: true
  checkpoint_every_steps: 500
  # Weights-only snapshots at the curriculum's stage boundaries, for trajectory validation.
  keep_weights_at: [0.35, 0.70]
  rule_balanced_batches: true
  rule_balance_rotate_each_epoch: true

regularization:
  variance_weight: 0.01
  covariance_weight: 0.005
  min_dim_std: 0.03
  matryoshka_weight: 0.20
  matryoshka_dims: [32, 64, 128]

validation:
  batch_size: 32
  max_samples: 512
  # ~1,200 val triplets per Genshin/paratarget rule (8192 cap), up to 512 scored per (rule, seen|held-out)
  # bucket: about +-2 points standard error on a violation rate instead of +-6 at 64.
  per_rule: 512
  max_triplets: 8192
  max_batches: 32
  length_course_triplets_per_domain: 128

logging:
  train_every_steps: 5
  # Mirrors TensorBoard scalars plus final validation metrics. Key: `swanlab login` on the box once.
  swanlab: {enabled: true, project: stylevec-2606, mode: online}

curriculum:
  enabled: true
  mode: staged   # staged | mixed (control: same budget, time-averaged mixture)
  stages:
    - {until: 0.35, tiers: {easy: 0.70, mid: 0.25, hard: 0.05}}
    - {until: 0.70, tiers: {easy: 0.35, mid: 0.40, hard: 0.25}}
    - {until: 1.00, tiers: {easy: 0.20, mid: 0.30, hard: 0.50}}
